name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore src/Totp.Desktop
      - run: dotnet restore tests/Totp.Tests
      - run: dotnet build src/Totp.Desktop -c Release --no-restore
      - run: dotnet build tests/Totp.Tests -c Release --no-restore
      - run: dotnet test tests/Totp.Tests -c Release --no-build --no-restore

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - run: dotnet restore src/Totp.Browser
      - run: dotnet build src/Totp.Browser -c Release --no-restore

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      # This workload set requires Xcode 26.6 on the macos-26 runner.
      - run: dotnet workload install ios --version 10.0.400
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: dotnet restore src/Totp.iOS -r iossimulator-arm64
      - run: dotnet build src/Totp.iOS -c Release -r iossimulator-arm64 --no-restore
